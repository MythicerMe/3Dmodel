<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
   <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
   </script>
   <script src="app.js" defer></script>
   <link rel="stylesheet" href="style.css">
</head>

<body>
   <audio autoplay loop>
      <source src="./assets/music-veda.mp3">
   </audio>

   <div class="modelPanel hide">
      <div class="firstRow">
         <p>انتخاب کنید</p>
         <i class="bi bi-x-square"></i>
      </div>
      <nav class="buttsinMenu">
         <button>صفحه اصلی</button>
         <button>کسب اطلاعات بیشتر</button>
      </nav>
   </div>
   
   <div class="overlay hidden"></div>

   <div class="topBar">

      <div class="menuIcon">
         <i class="bi bi-list"></i>
      </div>
      <div class="part2">
         <p>پروژه ساخت مقبره شهید گمنام در موکب عزیزم حسین (ع)</p>
         <div class="logo">
            <img src="./assets/logo.svg" alt="مجموعه فرهنگی کافه شهدا">
         </div>
      </div>
   </div>

   <div class="modelContain">
      <model-viewer class="model" src="./3D-Models/3D-v2.glb" camera-controls
         environment-image="./hdrs/citrus_orchard_road_puresky_1k.hdr" skybox-image=""
         camera-orbit="-33.51deg 43.47deg 79.8993m" camera-target="0.2404m 1.1063m -2.5702m" field-of-view="12deg">

         <div class="load">
            <div class="loadCircle"></div>

            <span id="">در حال بارگزاری</span>
            <!-- <div class="bar">
               <div class="inbar"></div>
            </div> -->
         </div>

      </model-viewer>
   </div>


   <div class="panel">
      <div class="guide">
         با استفاده از
         <span>یک انگشت</span>
         <span>بچرخید</span>
         و با استفاده از
         <span>دو انگشت</span>
         <span>حرکت</span>
         کنید.

      </div>
      <div class="secondpanel">

         <div class="buttons">
            <button class="chngModel yellowButton">

               <span class="chngtxt">مشاهده بنای زیرین</span>
               <i class="bi bi-arrow-down-up"></i>
            </button>
            <button class="reset">

               <span>بازگشت به حالت اولیه</span>
               <i class="bi bi-repeat"></i>
            </button>
         </div>
         <div class="info">
            <div>
               <span>طول زمین </span>
               <span>۵۰ متر</span>
            </div>
            <div>
               <span>عرض زمین</span>
               <span>۱۸ متر</span>
            </div>
            <div>
               <span>عمق زمین</span>
               <span>۵ متر</span>
            </div>
         </div>
      </div>
      <!-- <div class="Contribute">
         کسب اطلاعات بیشتر
         <i class="bi bi-box-arrow-up-right"></i>
      </div> -->




   </div>

   <!-- <div class="count">
<p style="display: inline;">مدت زمان باقی مانده تا پایان پروژه:</p>
<span class="days"></span>
<span class="rooz">روز</span>
</div> -->



</body>

</html>
